<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0912">
  <title>CueMe · Архив переписок</title>
  <link rel="preload" href="wallpaper-v3.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="app.css?v=9">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="app.js?v=9" defer></script>
</head>
<body>
  <section class="splash" id="splash" aria-label="Загрузка архива" role="status">
    <div class="monogram" aria-hidden="true"><img id="splash-logo" src="{{LOGO_URL}}" alt="" width="168" height="168"></div>
    <strong>CueMe</strong>
    <span class="loading-track"></span>
  </section>
  <main class="shell" id="app" hidden>
    <section id="inbox">
      <header class="archive-header">
        <div class="archive-title">
          <img id="archive-logo" alt="CueMe" width="48" height="48">
          <h1>Архив</h1>
        </div>
        <div class="search" id="search-box" hidden>
          <span aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Поиск по чатам" aria-label="Поиск по чатам" autocomplete="off">
        </div>
      </header>
      <p class="empty" id="inbox-status" role="status" hidden></p>
      <div class="chat-list" id="chat-list"></div>
    </section>
    <section id="conversation" hidden>
      <header class="chat-top">
        <div class="chat-header">
          <button type="button" class="back" id="back" aria-label="К списку переписок">←</button>
          <span id="chat-avatar" class="avatar" aria-hidden="true"></span>
          <h2 id="chat-name"></h2>
        </div>
        <div class="tabs" id="chat-filters" role="group" aria-label="Фильтр сообщений" hidden>
          <button type="button" id="all" aria-pressed="true">Все</button>
          <button type="button" id="deleted" aria-pressed="false">Удалённые</button>
        </div>
      </header>
      <div id="history" class="history">
        <button type="button" class="more" id="more" hidden>Загрузить более ранние</button>
        <p class="empty" id="chat-status" role="status" hidden></p>
        <div id="messages"></div>
      </div>
    </section>
  </main>
  <dialog id="media-viewer" class="media-viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <button id="viewer-close" type="button" aria-label="Закрыть просмотр">×</button>
      <h2 id="viewer-title"></h2>
      <div class="viewer-actions">
        <button id="viewer-options" type="button" aria-label="Действия с файлом" aria-controls="viewer-menu" aria-expanded="false">⋯</button>
        <div id="viewer-menu" class="viewer-menu" hidden>
          <button id="viewer-download" type="button">Скачать</button>
        </div>
      </div>
    </div>
    <div id="viewer-stage" class="viewer-stage"></div>
    <p id="viewer-status" class="viewer-status" role="status" hidden></p>
    <div id="viewer-zoom" class="viewer-zoom" hidden aria-label="Масштаб фото">
      <button id="viewer-less" type="button" aria-label="Уменьшить">−</button>
      <button id="viewer-more" type="button" aria-label="Приблизить">+</button>
    </div>
  </dialog>
</body>
</html>
